name: Crawler and MCP CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests (offline)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v2

      - name: Create Python 3.12 environment
        run: uv venv --python 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run deterministic unit tests
        run: |
          .venv/bin/pytest -q \
            tests/test_http.py \
            tests/test_wiki_content.py \
            tests/test_umapyoi.py \
            tests/test_biligame_assets.py \
            tests/test_biligame_chibi.py \
            tests/test_character_index.py \
            tests/test_cli_config.py \
            tests/test_mcp_config.py \
            tests/test_umamusu_wiki.py

  crawler-api:
    name: Source clients (4 Wiki + Umapyoi)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v2

      - name: Create Python 3.12 environment
        run: uv venv --python 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Crawl pages directly through Python APIs
        run: |
          .venv/bin/pytest -q \
            tests/test_biligame_crawler.py \
            tests/test_moegirl_crawler.py \
            tests/test_umamusu_wiki_crawler.py

      - name: Search titles directly through Python APIs
        run: .venv/bin/pytest -q tests/test_search_title.py

      - name: Query wikiru and Umapyoi public sources
        env:
          RUN_SOURCE_INTEGRATION: "1"
        run: .venv/bin/pytest -q tests/test_supplemental_sources.py

  mcp-tools:
    name: MCP Tool calls (4 Wiki + Umapyoi)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v2

      - name: Create Python 3.12 environment
        run: uv venv --python 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Start MCP HTTP server
        run: |
          nohup .venv/bin/python mcpserver.py --http -p 7777 > mcpserver.log 2>&1 &

      - name: Wait for MCP HTTP server
        run: |
          for attempt in {1..30}; do
            if .venv/bin/python -c 'import socket; socket.create_connection(("127.0.0.1", 7777), timeout=1).close()'; then
              exit 0
            fi
            sleep 1
          done
          cat mcpserver.log
          exit 1

      - name: Invoke all four Wiki and Umapyoi MCP tools
        env:
          RUN_MCP_INTEGRATION: "1"
          MCP_URL: http://127.0.0.1:7777/mcp/
        run: .venv/bin/pytest -q tests/test_mcp_wiki_tools.py

      - name: Upload MCP server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mcpserver-log
          path: mcpserver.log
